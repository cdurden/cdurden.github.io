<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<title>reveal.js - Markdown Example</title>

		<link rel="stylesheet" href="../dist/reveal.css" />
		<link rel="stylesheet" href="../dist/theme/white.css" id="theme" />

		<link rel="stylesheet" href="../dist/plugin/highlight/monokai.css" />
	</head>

	<body>
		<div class="reveal">
			<div class="slides">
				<!-- Use external markdown resource, separate slides by three newlines; vertical slides by two newlines -->
				<section
					data-markdown="day1.md"
					data-separator="^\n\n\n"
					data-separator-vertical="^\n\n"
				></section>

			</div>
		</div>

		<script src="../dist/reveal.js"></script>
		<script src="../dist/reveal.js"></script>
		<script src="../dist/plugin/markdown.js"></script>
		<script src="../dist/plugin/highlight.js"></script>
		<script src="../dist/plugin/notes.js"></script>
		<script src="../dist/plugin/math.js"></script>
		<script src="../dist/plugin/zoom.js"></script>

		<script>
			Reveal.initialize({
				controls: true,
				progress: true,
				history: true,
				center: true,

				markdown: {
					smartypants: true,
				},

				plugins: [RevealMarkdown, RevealHighlight, RevealNotes, RevealMath.KaTeX, RevealZoom],
			});
		</script>
	</body>
</html>
